name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run catches regressions caused by changes in the public demo apps.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests - ${{ matrix.browser }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser and OS dependencies
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI and API tests
        # Re-run only on network/navigation timeouts against the public demo sites;
        # assertion failures are never retried.
        run: >
          pytest --browser ${{ matrix.browser }} -n 2
          --reruns 1 --only-rerun TimeoutError

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  allure-report:
    name: Publish Allure report
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download results from all browsers
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: artifacts

      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find artifacts -path '*allure-results/*' -type f -exec cp {} allure-results/ \;
          ls allure-results | wc -l

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Allure report
        run: |
          npm install --global allure-commandline
          allure generate allure-results --clean --output allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

[project]
name = "ecommerce-playwright-pytest"
version = "1.0.0"
description = "UI and API test automation framework for an e-commerce demo app using Python, Playwright and Pytest."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--html=reports/pytest-report.html",
    "--self-contained-html",
    "--alluredir=reports/allure-results",
    "--output=test-results",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--video=retain-on-failure",
]
markers = [
    "smoke: critical business-flow tests, run on every change",
    "regression: broader functional regression coverage",
    "api: REST API contract and response validation tests",
]
filterwarnings = [
    # Raised by the third-party pytest-base-url plugin, not by this project.
    "ignore:Session-scoped fixtures defined as instance methods are deprecated:pytest.PytestRemovedIn10Warning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pages", "utils"]
